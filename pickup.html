<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pick Up — Studio Route 134</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F7F5EF;--bg-2:#ECE9DF;--surface:#FFFFFF;
    --ink:#15233F;--ink-2:#2B3E5E;--ink-soft:#6E7A8E;
    --navy:#1B2F52;--navy-deep:#11203B;
    --gold:#B89A5C;--gold-deep:#977C42;--gold-light:#D8C28C;
    --line:#DAD5C7;
    --ease:cubic-bezier(0.16,1,0.3,1);
    --font-sans:"Helvetica Neue","Helvetica","Arial","Noto Sans JP","Yu Gothic","游ゴシック","Hiragino Sans","ヒラギノ角ゴ ProN","Meiryo",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;overflow-x:hidden;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:15px;font-weight:300;line-height:1.9;letter-spacing:0.02em;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  img{display:block;max-width:100%;height:auto;}
  a{color:inherit;text-decoration:none;}
  h1,h2,h3{font-family:var(--font-sans);font-weight:500;letter-spacing:0.02em;}
  .topbar{background:var(--navy-deep);color:var(--bg);font-size:10px;letter-spacing:0.32em;text-transform:uppercase;padding:10px;text-align:center;}
  header{padding:22px 48px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  header .back{font-size:11px;letter-spacing:0.24em;text-transform:uppercase;font-weight:500;}
  header .back:hover{color:var(--gold-deep);}
  header .logo img{height:40px;width:auto;}

  .pu-hero{max-width:1100px;margin:0 auto;padding:56px 48px 40px;text-align:center;}
  .pu-hero .eyebrow{font-size:11px;letter-spacing:0.34em;text-transform:uppercase;color:var(--gold-deep);font-weight:500;margin-bottom:14px;}
  .pu-hero h1{font-size:clamp(28px,2vw+14px,44px);line-height:1.28;font-weight:500;margin-bottom:20px;}
  .pu-hero .lead{font-family:var(--font-sans);font-size:16px;line-height:2;color:var(--ink-2);max-width:640px;margin:0 auto;font-weight:400;}

  .pu-main{max-width:1100px;margin:0 auto;padding:0 48px 60px;}
  .pu-visual{aspect-ratio:4/3;overflow:hidden;background:var(--bg-2);}
  .pu-visual img{width:100%;height:100%;object-fit:cover;}

  .pu-story{max-width:720px;margin:0 auto;padding:64px 40px 40px;}
  .pu-story p{font-size:15px;line-height:2.1;color:var(--ink-2);margin-bottom:22px;font-weight:300;}
  .pu-story .divider{width:40px;height:1px;background:var(--gold);margin:44px auto;opacity:0.7;}

  .pu-items{max-width:1000px;margin:0 auto;padding:20px 40px 80px;}
  .pu-items h2{font-size:14px;letter-spacing:0.28em;text-transform:uppercase;color:var(--ink);font-weight:600;padding-bottom:12px;margin-bottom:24px;border-bottom:1px solid var(--line);}
  .pu-items-list{display:grid;grid-template-columns:1fr;gap:24px;}
  .pu-item{display:grid;grid-template-columns:auto 1fr;gap:24px;padding:20px 0;border-bottom:1px solid var(--line);align-items:start;}
  .pu-item:last-child{border-bottom:none;}
  .pu-item-brand{font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold-deep);font-weight:600;min-width:180px;}
  .pu-item-info .pu-item-name{font-family:var(--font-sans);font-size:16px;font-weight:500;color:var(--ink);margin-bottom:8px;}
  .pu-item-info .pu-item-note{font-size:14px;line-height:2;color:var(--ink-2);font-weight:300;}

  .back-cta{text-align:center;padding:20px 20px 80px;}
  .back-cta a{display:inline-flex;align-items:center;gap:12px;font-size:11px;letter-spacing:0.28em;text-transform:uppercase;padding:14px 28px;border:1px solid var(--ink);color:var(--ink);font-weight:500;transition:all .4s var(--ease);}
  .back-cta a:hover{background:var(--navy);color:var(--surface);border-color:var(--navy);}

  footer{background:var(--navy-deep);color:var(--surface);padding:36px 48px;text-align:center;font-size:10.5px;letter-spacing:0.24em;text-transform:uppercase;opacity:0.65;}

  @media (max-width:900px){
    header,.pu-hero,.pu-main,.pu-story,.pu-items,.back-cta,footer{padding-left:20px;padding-right:20px;}
    .pu-item{grid-template-columns:1fr;gap:8px;}
    .pu-item-brand{min-width:0;}
  }
</style>
</head>
<body>

<div class="topbar">Complimentary Shipping over ¥30,000 &nbsp;·&nbsp; 国内正規販売店</div>

<header>
  <a href="index.html" class="back">← Back to Home</a>
  <a href="index.html" class="logo"><img src="sr134_logo.png" alt="Studio Route 134"></a>
  <span style="width:120px"></span>
</header>

<section class="pu-hero">
  <div class="eyebrow" data-date>—</div>
  <h1 data-title>—</h1>
  <div class="lead" data-lead>—</div>
</section>

<section class="pu-main">
  <div class="pu-visual"><img data-hero-img alt=""></div>
</section>

<article class="pu-story" data-story></article>

<section class="pu-items">
  <h2>This Coordinate</h2>
  <div class="pu-items-list" data-items></div>
</section>

<div class="back-cta">
  <a href="index.html">Back to Home <span>→</span></a>
</div>

<footer>© 2026 Studio Route 134 / Office T3 Inc.</footer>

<script>
const $=(s,r=document)=>r.querySelector(s);
(async()=>{
  const id=new URLSearchParams(location.search).get('id');
  if(!id){location.href='index.html#pickup';return;}
  const all=await(await fetch('pickup.json')).json();
  const p=all.find(x=>x.id===id);
  if(!p){alert('コーディネートが見つかりません');location.href='index.html#pickup';return;}
  document.title=`${p.title} — Pick Up — Studio Route 134`;
  $('[data-date]').textContent=p.date;
  $('[data-title]').textContent=p.title;
  $('[data-lead]').textContent=p.lead||'';
  $('[data-hero-img]').src=p.image;
  $('[data-hero-img]').alt=p.title;
  $('[data-story]').innerHTML=(p.story||[]).map(par=>`<p>${par}</p>`).join('')+(p.story?'<div class="divider"></div>':'');
  $('[data-items]').innerHTML=(p.items||[]).map(it=>`
    <div class="pu-item">
      <div class="pu-item-brand">${it.brand}</div>
      <div class="pu-item-info">
        <div class="pu-item-name">${it.name}</div>
        ${it.note?`<div class="pu-item-note">${it.note}</div>`:''}
      </div>
    </div>`).join('');
})();
</script>
</body>
</html>

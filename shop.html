<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Studio Route 134 全商品カタログ — Marni, Moncler, Maison Margiela, MM6, Dsquared2, Amiri, Bob, Autry ほか。">
<title>Shop — Studio Route 134</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Noto+Serif+JP:wght@300;400&family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F7F5EF;--bg-2:#ECE9DF;--surface:#FFFFFF;
    --ink:#15233F;--ink-2:#2B3E5E;--ink-soft:#6E7A8E;
    --navy:#1B2F52;--navy-deep:#11203B;
    --gold:#B89A5C;--gold-deep:#977C42;--gold-light:#D8C28C;
    --line:#DAD5C7;
    --ease:cubic-bezier(0.16,1,0.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter','Noto Sans JP',sans-serif;font-size:15px;font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased;}
  img{display:block;max-width:100%;height:auto;}
  a{color:inherit;text-decoration:none;}
  h1,h2{font-family:'Playfair Display','Noto Serif JP',serif;font-weight:400;letter-spacing:-0.01em;}

  .topbar{background:var(--navy-deep);color:var(--bg);font-size:10px;letter-spacing:0.32em;text-transform:uppercase;padding:10px;text-align:center;}
  header{padding:22px 48px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  header .back{font-size:11px;letter-spacing:0.24em;text-transform:uppercase;font-weight:500;}
  header .back:hover{color:var(--gold-deep);}
  header .logo img{height:40px;width:auto;}
  header .icon-cart{position:relative;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--ink);border-radius:50%;opacity:0.85;}
  header .icon-cart svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;}
  header .cart-badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:var(--surface);font-size:10px;font-weight:600;display:none;align-items:center;justify-content:center;font-feature-settings:'lnum' 1;}
  header .cart-badge.active{display:inline-flex;}

  .page-hero{padding:80px 48px 40px;text-align:center;}
  .page-hero .eyebrow{font-size:11px;letter-spacing:0.34em;text-transform:uppercase;color:var(--ink-soft);font-weight:500;margin-bottom:22px;}
  .page-hero h1{font-size:clamp(38px,3vw+14px,64px);line-height:1.06;margin-bottom:18px;}
  .page-hero h1 em{font-style:normal;color:var(--gold-deep);}
  .page-hero .count{font-family:'Playfair Display',serif;font-size:14px;color:var(--ink-soft);font-feature-settings:'lnum' 1;}

  .filters{padding:24px 48px 32px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;border-bottom:1px solid var(--line);margin-bottom:56px;}
  .f-chip{padding:9px 18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer;font-family:inherit;font-weight:500;transition:all .25s;}
  .f-chip:hover{border-color:var(--gold-deep);color:var(--gold-deep);}
  .f-chip.active{background:var(--navy);color:var(--surface);border-color:var(--navy);}
  .f-count{font-size:11px;color:var(--ink-soft);letter-spacing:0.14em;margin-left:12px;font-feature-settings:'lnum' 1;}

  .catalog{padding:0 48px 120px;display:grid;grid-template-columns:repeat(4,1fr);gap:36px 26px;}
  .p-card{display:block;}
  .p-card .pv{aspect-ratio:4/5;background:var(--surface);overflow:hidden;display:flex;align-items:center;justify-content:center;padding:6%;margin-bottom:14px;transition:background .3s;}
  .p-card:hover .pv{background:var(--bg-2);}
  .p-card .pv img{max-width:100%;max-height:100%;object-fit:contain;transition:transform 1.2s var(--ease);}
  .p-card:hover .pv img{transform:scale(1.03);}
  .p-card .pb{font-size:10.5px;letter-spacing:0.24em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:5px;font-weight:500;}
  .p-card .pn{font-family:'Playfair Display',serif;font-size:15px;line-height:1.3;color:var(--ink);margin-bottom:4px;}
  .p-card .pp{font-size:12.5px;color:var(--ink-2);font-feature-settings:'lnum' 1;letter-spacing:0.06em;}
  .p-card.hidden{display:none;}

  footer{background:var(--navy-deep);color:var(--surface);padding:36px 48px;text-align:center;font-size:10.5px;letter-spacing:0.24em;text-transform:uppercase;opacity:0.65;}

  @media (max-width:1100px){.catalog{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:800px){.catalog{grid-template-columns:1fr 1fr;padding:0 20px 80px;}header,.page-hero,.filters,footer{padding-left:20px;padding-right:20px;}}

  /* Cart drawer (shared) */
  .cart-scrim{position:fixed;inset:0;z-index:200;background:rgba(17,32,59,0.42);opacity:0;pointer-events:none;transition:opacity .45s var(--ease);backdrop-filter:blur(3px);}
  .cart-scrim.open{opacity:1;pointer-events:auto;}
  .cart-drawer{position:fixed;top:0;right:0;z-index:210;width:100%;max-width:460px;height:100vh;background:var(--surface);box-shadow:-20px 0 60px -20px rgba(17,32,59,0.28);transform:translateX(105%);transition:transform .55s var(--ease);display:flex;flex-direction:column;}
  .cart-drawer.open{transform:translateX(0);}
  .cd-head{padding:22px 28px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);}
  .cd-head h3{font-family:'Playfair Display',serif;font-size:20px;font-weight:400;}
  .cd-close{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--line);cursor:pointer;background:none;color:var(--ink);font-size:16px;}
  .cd-body{flex:1;overflow-y:auto;padding:22px 28px;}
  .cd-empty{text-align:center;padding:60px 20px;color:var(--ink-soft);font-family:'Noto Serif JP',serif;font-size:14px;line-height:2;}
  .cd-empty small{display:block;margin-top:6px;font-size:10px;letter-spacing:0.28em;text-transform:uppercase;color:var(--gold-deep);font-family:'Inter',sans-serif;}
  .cd-items{display:flex;flex-direction:column;gap:18px;}
  .cd-item{display:grid;grid-template-columns:80px 1fr auto;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--line);}
  .cd-item-visual{width:80px;aspect-ratio:4/5;background:var(--surface);overflow:hidden;display:flex;align-items:center;justify-content:center;padding:6%;}
  .cd-item-visual img{max-width:100%;max-height:100%;object-fit:contain;}
  .cd-item-info{display:flex;flex-direction:column;gap:4px;}
  .cd-item-brand{font-size:9.5px;letter-spacing:0.24em;text-transform:uppercase;color:var(--gold-deep);font-weight:500;}
  .cd-item-name{font-family:'Playfair Display',serif;font-size:14.5px;line-height:1.25;}
  .cd-item-qty{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12px;font-feature-settings:'lnum' 1;}
  .cd-qty-btn{width:22px;height:22px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;line-height:1;display:inline-flex;align-items:center;justify-content:center;}
  .cd-item-price{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end;font-size:13px;font-feature-settings:'lnum' 1;}
  .cd-item-remove{background:none;border:none;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-soft);cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
  .cd-foot{padding:22px 28px 28px;border-top:1px solid var(--line);background:var(--bg);}
  .cd-total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-soft);}
  .cd-total-amount{font-family:'Playfair Display',serif;font-size:22px;color:var(--ink);text-transform:none;font-feature-settings:'lnum' 1;}
  .cd-checkout{width:100%;padding:16px 24px;background:var(--navy);color:var(--surface);border:none;font-size:11px;letter-spacing:0.28em;text-transform:uppercase;font-weight:500;cursor:pointer;transition:background .3s;}
  .cd-checkout:disabled{background:var(--ink-soft);cursor:not-allowed;}
  .cd-note{margin-top:10px;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-soft);text-align:center;}
</style>
</head>
<body>

<div class="topbar">Complimentary Shipping over ¥30,000 &nbsp;·&nbsp; 国内正規販売店</div>

<header>
  <a href="index.html" class="back">← Back to Home</a>
  <a href="index.html" class="logo"><img src="sr134_logo.png" alt="Studio Route 134"></a>
  <a href="#" class="icon-cart" data-cart-toggle aria-label="Cart">
    <svg viewBox="0 0 24 24"><path d="M5 6h15l-1.6 9.4a2 2 0 0 1-2 1.6H9.2a2 2 0 0 1-2-1.6L5 6z" stroke-linejoin="round"/><path d="M3 3h2l0.6 3" stroke-linecap="round"/><circle cx="10" cy="20" r="1.2" fill="currentColor" stroke="none"/><circle cx="17" cy="20" r="1.2" fill="currentColor" stroke="none"/></svg>
    <span class="cart-badge" data-cart-count></span>
  </a>
</header>

<section class="page-hero">
  <div class="eyebrow">Shop</div>
  <h1>All <em>Products.</em></h1>
  <div class="count" data-count>—</div>
</section>

<div class="filters" data-filters></div>

<main class="catalog" data-catalog></main>

<footer>© 2026 Studio Route 134 / Office T3 Inc.</footer>

<div class="cart-scrim" data-cart-scrim></div>
<aside class="cart-drawer" data-cart-drawer>
  <div class="cd-head"><h3>Your Cart</h3><button class="cd-close" data-cart-close aria-label="Close cart">×</button></div>
  <div class="cd-body" data-cart-body>
    <div class="cd-empty">カートはまだ空です。<br>お気に入りの一着を、ここに。<small>Add to Cart</small></div>
  </div>
  <div class="cd-foot">
    <div class="cd-total"><span>Subtotal</span><span class="cd-total-amount" data-cart-total>¥0</span></div>
    <button class="cd-checkout" data-cart-checkout disabled>Checkout</button>
    <div class="cd-note">Shopify統合準備中 · ご案内は近日</div>
  </div>
</aside>

<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>r.querySelectorAll(s);
const yen=n=>n==null?'—':'¥'+n.toLocaleString('en-US');
const CART_KEY='sr134_cart_v1';
function getCart(){try{return JSON.parse(localStorage.getItem(CART_KEY)||'[]')}catch{return[]}}
function saveCart(items){localStorage.setItem(CART_KEY,JSON.stringify(items));renderCart();}
function addToCart(p){const items=getCart();const ex=items.find(i=>i.id===p.id);if(ex)ex.qty++;else items.push({...p,qty:1});saveCart(items);openCart();}
function changeQty(id,d){const items=getCart();const it=items.find(i=>i.id===id);if(!it)return;it.qty=Math.max(0,it.qty+d);saveCart(items.filter(i=>i.qty>0));}
function removeFromCart(id){saveCart(getCart().filter(i=>i.id!==id));}
function openCart(){$('[data-cart-drawer]').classList.add('open');$('[data-cart-scrim]').classList.add('open');document.body.style.overflow='hidden';}
function closeCart(){$('[data-cart-drawer]').classList.remove('open');$('[data-cart-scrim]').classList.remove('open');document.body.style.overflow='';}
function renderCart(){
  const items=getCart();
  const count=items.reduce((s,i)=>s+i.qty,0);
  const total=items.reduce((s,i)=>s+i.price*i.qty,0);
  const b=$('[data-cart-count]');b.textContent=count||'';b.classList.toggle('active',count>0);
  $('[data-cart-total]').textContent=yen(total);
  $('[data-cart-checkout]').disabled=count===0;
  const body=$('[data-cart-body]');
  if(!items.length){body.innerHTML='<div class="cd-empty">カートはまだ空です。<br>お気に入りの一着を、ここに。<small>Add to Cart</small></div>';return;}
  body.innerHTML='<div class="cd-items">'+items.map(i=>`<div class="cd-item"><div class="cd-item-visual"><img src="${i.image}" alt=""></div><div class="cd-item-info"><div class="cd-item-brand">${i.brand}</div><div class="cd-item-name">${i.name}</div><div class="cd-item-qty"><button class="cd-qty-btn" data-qty="-1" data-id="${i.id}">−</button><span>${i.qty}</span><button class="cd-qty-btn" data-qty="1" data-id="${i.id}">+</button></div></div><div class="cd-item-price"><span>${yen(i.price*i.qty)}</span><button class="cd-item-remove" data-remove="${i.id}">Remove</button></div></div>`).join('')+'</div>';
}
document.addEventListener('click',(e)=>{
  if(e.target.closest('[data-cart-toggle]')){e.preventDefault();openCart();return;}
  if(e.target.closest('[data-cart-close]')||e.target.matches('[data-cart-scrim]')){closeCart();return;}
  const q=e.target.closest('[data-qty]');if(q){changeQty(q.dataset.id,+q.dataset.qty);return;}
  const r=e.target.closest('[data-remove]');if(r){removeFromCart(r.dataset.remove);return;}
  if(e.target.closest('[data-cart-checkout]')){alert('Shopify統合後、ここでチェックアウトへ遷移します。');return;}
});

let ALL_PRODUCTS=[];
let CURRENT_FILTER=null;

function renderCatalog(){
  const grid=$('[data-catalog]');
  const list=CURRENT_FILTER?ALL_PRODUCTS.filter(p=>p.brand===CURRENT_FILTER):ALL_PRODUCTS;
  grid.innerHTML=list.map(p=>`
    <a class="p-card" href="product.html?id=${p.id}">
      <div class="pv"><img referrerpolicy="no-referrer" src="${p.image}" alt="${p.brand} ${p.name}"></div>
      <div class="pb">${p.brand}</div>
      <div class="pn">${p.name}</div>
    </a>`).join('');
  $('[data-count]').textContent = `${list.length} products${CURRENT_FILTER ? ' · ' + CURRENT_FILTER : ''}`;
}

function renderFilters(){
  const brands=[...new Set(ALL_PRODUCTS.map(p=>p.brand))].sort();
  const filters=$('[data-filters]');
  filters.innerHTML = `<button class="f-chip ${!CURRENT_FILTER?'active':''}" data-f="">All</button>` +
    brands.map(b=>`<button class="f-chip ${CURRENT_FILTER===b?'active':''}" data-f="${b}">${b}</button>`).join('');
  filters.addEventListener('click',(e)=>{
    const b=e.target.closest('[data-f]');if(!b)return;
    CURRENT_FILTER = b.dataset.f || null;
    const url = new URL(location);
    if (CURRENT_FILTER) url.searchParams.set('brand', CURRENT_FILTER); else url.searchParams.delete('brand');
    history.replaceState({},'',url);
    renderCatalog(); renderFilters();
  }, { once: false });
}

(async ()=>{
  try{ ALL_PRODUCTS = await (await fetch('products.json')).json(); }
  catch{ $('[data-catalog]').innerHTML='<p style="padding:40px;color:#6E7A8E">商品データを読み込めませんでした。</p>';return; }
  CURRENT_FILTER = new URLSearchParams(location.search).get('brand');
  renderFilters();
  renderCatalog();
  renderCart();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gallery — Studio Route134</title>
<meta name="description" content="Studio Route134 のギャラリー。店舗とブランドにまつわる記録。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Bodoni+Moda:wght@700;800;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5EF; --surface:#FFFFFF; --ink:#15233F; --ink-soft:#6E7A8E;
    --line:#DAD5C7; --gold:#B89A5C; --gold-deep:#977C42; --gold-light:#D8C28C;
    --font-sans:'Noto Sans JP','Helvetica Neue',sans-serif;
    --ease:cubic-bezier(0.16,1,0.3,1);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-sans); font-weight:300; line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  .wrap{max-width:1240px; margin:0 auto; padding:0 clamp(20px,4vw,56px);}
  header.site{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:22px clamp(20px,4vw,56px); border-bottom:1px solid var(--line);
  }
  .logo-center{grid-column:2; text-align:center; line-height:0;}
  .logo-center img{height:44px; width:auto; display:inline-block;}
  .back{grid-column:1; justify-self:start;}
  @media (max-width:640px){
    .logo-center img{height:34px;}
    .back{font-size:10px;}
  }
  .back{font-size:11px; letter-spacing:0.24em; text-transform:uppercase; text-decoration:none; color:var(--ink-soft);}
  .back:hover{color:var(--gold-deep);}
  .head{padding:clamp(40px,5vw,72px) 0 28px;}
  /* TOPのセクション見出しと同じ表情に揃える */
  .head h1{
    font-family:var(--font-sans);
    font-size:11px; letter-spacing:0.3em; text-transform:uppercase;
    color:var(--gold-deep); font-weight:500; margin:0;
  }
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; padding-bottom:clamp(56px,6vw,96px);}
  .cell{position:relative; display:block; aspect-ratio:3/4; overflow:hidden; background:var(--surface); text-decoration:none;}
  .cell img{width:100%; height:100%; object-fit:cover; transition:transform 1.4s var(--ease);}
  .cell:hover img{transform:scale(1.04);}
  .label{
    position:absolute; left:0; right:0; bottom:0; padding:20px 20px 18px;
    background:linear-gradient(180deg,transparent 0%,rgba(17,32,59,0.86) 78%);
    color:var(--surface); transform:translateY(30%); opacity:0;
    transition:transform .4s var(--ease),opacity .4s var(--ease); pointer-events:none;
  }
  .cell:hover .label{transform:translateY(0); opacity:1;}
  .date{font-size:10px; letter-spacing:0.26em; text-transform:uppercase; color:var(--gold-light); font-weight:500; margin-bottom:6px;}
  .title{font-size:15px; line-height:1.35; font-weight:500;}
  footer{border-top:1px solid var(--line); padding:26px 0; font-size:11px; letter-spacing:0.16em; color:var(--ink-soft); text-align:center;}
  @media (max-width:720px){
    .grid{grid-template-columns:repeat(2,1fr); gap:8px;}
    .label{transform:translateY(0); opacity:1; padding:12px 12px 10px;}
    .title{font-size:12.5px;}
  }
</style>
</head>
<body>
<script>const SR134_REV = '20260926';</script>

<header class="site">
  <a class="back" href="index.html">← Back to Top</a>
  <a class="logo-center" href="index.html"><img src="sr134_logo.png" alt="Studio Route134"></a>
</header>

<div class="wrap">
  <div class="head">
    <h1>Gallery</h1>
  </div>
  <div class="grid" data-grid></div>
</div>

<footer>© 2026 Studio Route134 / Office T3 Inc.</footer>

<script>
(async function () {
  const grid = document.querySelector('[data-grid]');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  try {
    const items = await (await fetch('journal.json?v=' + SR134_REV)).json();
    grid.innerHTML = items.map(it => `
      <a href="journal.html?id=${esc(it.id)}" class="cell">
        <img src="${esc(it.image)}" alt="${esc(it.title)}" loading="lazy">
        <div class="label">
          <div class="date">${esc(it.date)} — ${esc(it.location || '')}</div>
          <div class="title">${esc(it.title)}</div>
        </div>
      </a>`).join('');
  } catch (e) {
    grid.innerHTML = '';
  }
})();
</script>
</body>
</html>

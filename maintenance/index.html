<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Studio Route134</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5EF;--bg-2:#ECE9DF;--surface:#FFFFFF;
    --ink:#15233F;--ink-2:#2B3E5E;--ink-soft:#6E7A8E;
    --navy:#1B2F52;--navy-deep:#11203B;
    --gold:#B89A5C;--gold-deep:#977C42;
    --line:#DAD5C7;
    --font-sans:"Helvetica Neue","Helvetica","Arial","Noto Sans JP","Yu Gothic","游ゴシック","Hiragino Sans","Meiryo",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--font-sans);
    font-size:15px;font-weight:300;line-height:1.9;letter-spacing:0.02em;
    min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
  }
  img{display:block;max-width:100%;height:auto;}
  a{color:inherit;}
  .bar{background:var(--navy-deep);color:var(--bg);font-size:10px;letter-spacing:0.32em;text-transform:uppercase;padding:10px;text-align:center;}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:56px 24px;}
  .card{max-width:620px;width:100%;text-align:center;}
  .logo{height:56px;width:auto;margin:0 auto 40px;}
  .eyebrow{font-size:10.5px;letter-spacing:0.34em;text-transform:uppercase;color:var(--gold-deep);font-weight:500;margin-bottom:18px;}
  h1{font-size:clamp(26px,3vw+12px,40px);line-height:1.25;font-weight:400;letter-spacing:0.04em;margin-bottom:24px;}
  .rule{width:44px;height:1px;background:var(--gold);margin:0 auto 28px;opacity:0.8;}
  p{color:var(--ink-2);margin-bottom:14px;}
  .stores{margin-top:38px;padding-top:28px;border-top:1px solid var(--line);}
  .stores h2{font-size:10.5px;letter-spacing:0.28em;text-transform:uppercase;color:var(--ink-soft);font-weight:500;margin-bottom:14px;}
  .stores p{font-size:14px;margin-bottom:6px;}
  .contact{margin-top:28px;font-size:14px;}
  .contact a{color:var(--ink);border-bottom:1px solid var(--gold);text-decoration:none;}
  .contact a:hover{color:var(--gold-deep);}
  footer{background:var(--navy-deep);color:var(--surface);padding:26px 24px;text-align:center;font-size:10px;letter-spacing:0.24em;text-transform:uppercase;opacity:0.7;}
  @media (max-width:600px){ main{padding:40px 20px;} .logo{height:44px;margin-bottom:30px;} }
</style>
</head>
<body>

<div class="bar">Under Construction</div>

<main>
  <div class="card">
    <img class="logo" src="sr134_logo.png" alt="Studio Route134">
    <div class="eyebrow">Under Construction</div>
    <h1>ただいまサイトを<br>リニューアルしております</h1>
    <div class="rule"></div>
    <p>いつもStudio Route134をご利用いただき、誠にありがとうございます。</p>
    <p>現在、オンラインストアの全面的なリニューアル作業を行っており、一時的にサイトの公開を停止しております。公開の再開まで、いましばらくお待ちください。</p>

    <div class="stores">
      <h2>Stores</h2>
      <p>湘南葉山店</p>
      <p>湘南江ノ島店</p>
      <p>東京青山店</p>
      <p>各店舗は通常どおり営業しております</p>
    </div>

    <div class="contact">
      <p>お問い合わせ <a href="mailto:info@sr134.com">info@sr134.com</a></p>
    </div>
  </div>
</main>

<footer>© 2026 Studio Route134 / Office T3 Inc.</footer>

</body>
</html>

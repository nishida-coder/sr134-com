<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media — Studio Route134</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F7F5EF;--bg-2:#ECE9DF;--surface:#FFFFFF;
    --ink:#15233F;--ink-2:#2B3E5E;--ink-soft:#6E7A8E;
    --navy:#1B2F52;--navy-deep:#11203B;
    --gold:#B89A5C;--gold-deep:#977C42;--gold-light:#D8C28C;
    --line:#DAD5C7;
    --ease:cubic-bezier(0.16,1,0.3,1);
    --font-sans:"Helvetica Neue","Helvetica","Arial","Noto Sans JP","Yu Gothic","游ゴシック","Hiragino Sans","ヒラギノ角ゴ ProN","Meiryo",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:15px;font-weight:300;line-height:1.85;letter-spacing:0.02em;-webkit-font-smoothing:antialiased;}
  img{display:block;max-width:100%;height:auto;}
  a{color:inherit;text-decoration:none;}
  h1,h2,h3{font-family:var(--font-sans);font-weight:500;letter-spacing:0.02em;}
  .topbar{background:var(--navy-deep);color:var(--bg);font-size:10px;letter-spacing:0.32em;text-transform:uppercase;padding:10px;text-align:center;}
  header{padding:22px 48px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  header .back{font-size:11px;letter-spacing:0.24em;text-transform:uppercase;font-weight:500;}
  header .back:hover{color:var(--gold-deep);}
  header .logo img{height:40px;width:auto;}

  .feature{max-width:1200px;margin:0 auto;padding:64px 48px 40px;display:grid;grid-template-columns:1.15fr 1fr;gap:60px;align-items:center;}
  .feature-visual{aspect-ratio:4/5;overflow:hidden;background:var(--bg-2);}
  .feature-visual img{width:100%;height:100%;object-fit:cover;transition:transform 1.6s var(--ease);}
  .feature-visual:hover img{transform:scale(1.03);}
  .feature-info .badge{display:inline-block;font-family:var(--font-sans);font-size:34px;color:var(--ink);letter-spacing:-0.01em;margin-bottom:22px;padding:4px 20px;border:1px solid var(--ink);font-weight:600;}
  .feature-info .date{font-size:10.5px;letter-spacing:0.28em;text-transform:uppercase;color:var(--gold-deep);font-weight:500;margin-bottom:12px;}
  .feature-info h1{font-size:clamp(24px,1.8vw+12px,34px);line-height:1.22;margin-bottom:24px;font-weight:500;}
  .feature-info .lead{font-size:15px;line-height:2;color:var(--ink);font-weight:400;margin-bottom:28px;}

  .feature-body{max-width:720px;margin:0 auto;padding:0 40px 60px;}
  .feature-body p{font-size:15px;line-height:2.1;color:var(--ink-2);margin-bottom:22px;font-weight:300;}
  .feature-body .divider{width:40px;height:1px;background:var(--gold);margin:44px auto;opacity:0.7;}

  .more-media{max-width:1200px;margin:0 auto;padding:0 40px 100px;}
  .more-media h3{font-size:14px;letter-spacing:0.28em;text-transform:uppercase;color:var(--ink);font-weight:600;margin-bottom:24px;}
  .more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;}
  .more-card{display:block;}
  .more-card .mc-visual{aspect-ratio:16/10;overflow:hidden;background:var(--bg-2);margin-bottom:14px;}
  .more-card .mc-visual img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease);}
  .more-card:hover .mc-visual img{transform:scale(1.04);}
  .more-card .mc-badge{display:inline-block;font-size:14px;font-weight:600;letter-spacing:0.04em;color:var(--ink);padding:2px 8px;border:1px solid var(--ink);margin-bottom:8px;}
  .more-card .mc-title{font-size:14px;line-height:1.35;color:var(--ink);font-weight:400;}

  .back-cta{text-align:center;padding:20px 20px 80px;}
  .back-cta a{display:inline-flex;align-items:center;gap:12px;font-size:11px;letter-spacing:0.28em;text-transform:uppercase;padding:14px 28px;border:1px solid var(--ink);color:var(--ink);font-weight:500;transition:all .4s var(--ease);}
  .back-cta a:hover{background:var(--navy);color:var(--surface);border-color:var(--navy);}

  footer{background:var(--navy-deep);color:var(--surface);padding:36px 48px;text-align:center;font-size:10.5px;letter-spacing:0.24em;text-transform:uppercase;opacity:0.65;}

  @media (max-width:900px){
    header,.feature,.feature-body,.more-media,.back-cta,footer{padding-left:20px;padding-right:20px;}
    .feature{grid-template-columns:1fr;gap:32px;padding:32px 20px;}
    .more-grid{grid-template-columns:1fr;}
    .feature-info .badge{font-size:26px;}
  }
</style>
</head>
<body>

<div class="topbar">Complimentary Shipping over ¥30,000 &nbsp;·&nbsp; 国内正規販売店</div>

<header>
  <a href="index.html" class="back">← Back to Home</a>
  <a href="index.html" class="logo"><img src="sr134_logo.png" alt="Studio Route134"></a>
  <span style="width:120px"></span>
</header>

<section class="feature">
  <div class="feature-visual"><img data-hero-img alt=""></div>
  <div class="feature-info">
    <div class="badge" data-badge>—</div>
    <div class="date" data-date>—</div>
    <h1 data-title>—</h1>
    <div class="lead" data-lead>—</div>
  </div>
</section>

<article class="feature-body">
  <div data-body></div>
  <div class="divider"></div>
</article>

<section class="more-media">
  <h3>More Media</h3>
  <div class="more-grid" data-more></div>
</section>

<div class="back-cta">
  <a href="index.html">Back to Home <span>→</span></a>
</div>

<footer>© 2026 Studio Route134 / Office T3 Inc.</footer>

<script>
const $=(s,r=document)=>r.querySelector(s);
(async()=>{
  const id=new URLSearchParams(location.search).get('id');
  if(!id){location.href='index.html#media';return;}
  const all=await(await fetch('media.json')).json();
  const a=all.find(x=>x.id===id);
  if(!a){alert('掲載記事が見つかりません');location.href='index.html#media';return;}
  document.title=`${a.title} — ${a.badge} — Studio Route134`;
  $('[data-hero-img]').src=a.image;
  $('[data-hero-img]').alt=a.title;
  $('[data-badge]').textContent=a.badge;
  $('[data-date]').textContent=`${a.date} — ${a.location||''}`;
  $('[data-title]').textContent=a.title;
  $('[data-lead]').textContent=a.lead;
  $('[data-body]').innerHTML=(a.body||[]).map(p=>`<p>${p}</p>`).join('');
  const others=all.filter(x=>x.id!==id).slice(0,3);
  $('[data-more]').innerHTML=others.map(o=>`
    <a class="more-card" href="media.html?id=${o.id}">
      <div class="mc-visual"><img src="${o.image}" alt=""></div>
      <div class="mc-badge">${o.badge}</div>
      <div class="mc-title">${o.title}</div>
    </a>`).join('');
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>News — Studio Route134</title>
<meta name="description" content="Studio Route134 からのお知らせ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Bodoni+Moda:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5EF; --surface:#FFFFFF; --ink:#15233F; --ink-2:#2C3A52; --ink-soft:#6E7A8E;
    --line:#DAD5C7; --gold:#B89A5C; --gold-deep:#977C42; --navy:#1B2F52;
    --font-sans:'Noto Sans JP','Helvetica Neue',sans-serif;
    --ease:cubic-bezier(0.16,1,0.3,1);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--surface); color:var(--ink);
    font-family:var(--font-sans); font-weight:300; line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  .wrap{max-width:1100px; margin:0 auto; padding:0 clamp(20px,4vw,48px);}
  header.site{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:22px clamp(20px,4vw,48px); border-bottom:1px solid var(--line); background:var(--bg);
  }
  .back{grid-column:1; justify-self:start; font-size:11px; letter-spacing:0.24em; text-transform:uppercase; text-decoration:none; color:var(--ink-soft);}
  .back:hover{color:var(--gold-deep);}
  .logo-center{grid-column:2; text-align:center; line-height:0;}
  .logo-center img{height:44px; width:auto; display:inline-block;}

  .head{padding:clamp(40px,5vw,72px) 0 28px; text-align:center;}
  .date{font-size:11px; letter-spacing:0.3em; color:var(--gold-deep); font-weight:500; margin-bottom:14px;}
  h1{font-size:clamp(20px,1.4vw+14px,30px); line-height:1.55; font-weight:500; margin:0 auto; max-width:820px;}

  .gallery{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; padding:8px 0 40px;}
  .gallery figure{margin:0; background:var(--bg); overflow:hidden; aspect-ratio:3/4;}
  .gallery img{width:100%; height:100%; object-fit:cover; display:block;}

  .body{max-width:760px; margin:0 auto; padding-bottom:40px;}
  .body p{font-size:15.5px; line-height:2.1; color:var(--ink-2); margin:0 0 1.4em;}

  .cta{text-align:center; padding-bottom:clamp(48px,6vw,88px);}
  .cta a{
    display:inline-flex; align-items:center; gap:14px;
    font-size:12px; letter-spacing:0.32em; text-transform:uppercase;
    color:var(--ink); padding:14px 32px; text-decoration:none;
    border:1px solid var(--ink); font-weight:500; transition:all .4s var(--ease);
  }
  .cta a span{transition:transform .4s var(--ease);}
  .cta a:hover{background:var(--navy); color:var(--surface); border-color:var(--navy);}
  .cta a:hover span{transform:translateX(6px);}

  footer{border-top:1px solid var(--line); padding:26px 0; font-size:11px; letter-spacing:0.16em; color:var(--ink-soft); text-align:center;}
  @media (max-width:760px){
    .gallery{grid-template-columns:1fr; gap:10px;}
    .gallery figure{aspect-ratio:4/5;}
    .logo-center img{height:34px;}
  }
</style>
</head>
<body>
<script>const SR134_REV = '20260926';</script>

<header class="site">
  <a class="back" href="index.html">← Back to Top</a>
  <a class="logo-center" href="index.html"><img src="sr134_logo.png" alt="Studio Route134"></a>
</header>

<div class="wrap">
  <div class="head">
    <div class="date" data-date></div>
    <h1 data-title></h1>
  </div>
  <div class="gallery" data-gallery></div>
  <div class="body" data-body></div>
  <div class="cta" data-cta hidden><a href="#">ブランドを見る <span>→</span></a></div>
</div>

<footer>© 2026 Studio Route134 / Office T3 Inc.</footer>

<script>
(async function () {
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const id = new URLSearchParams(location.search).get('id');
  try {
    const all = await (await fetch('news.json?v=' + SR134_REV)).json();
    const n = id ? all.find(x => x.id === id) : all[0];
    if (!n) { location.href = 'index.html'; return; }

    document.title = `${n.title} — Studio Route134`;
    $('[data-date]').textContent = n.date || '';
    $('[data-title]').textContent = n.title || '';
    $('[data-gallery]').innerHTML = (n.images || []).map(src =>
      `<figure><img src="${esc(src)}" alt="${esc(n.title)}" loading="lazy"></figure>`).join('');
    const paragraphs = Array.isArray(n.body) && n.body.length ? n.body : [n.lead];
    $('[data-body]').innerHTML = paragraphs.filter(Boolean).map(t => `<p>${esc(t)}</p>`).join('');
    if (n.link) {
      const cta = $('[data-cta]');
      cta.querySelector('a').href = n.link;
      cta.hidden = false;
    }
  } catch (e) {
    location.href = 'index.html';
  }
})();
</script>
</body>
</html>

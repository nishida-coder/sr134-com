<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brands — Studio Route134</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5EF;--bg-2:#ECE9DF;--surface:#FFFFFF;
    --ink:#15233F;--ink-2:#2B3E5E;--ink-soft:#6E7A8E;
    --navy:#1B2F52;--navy-deep:#11203B;
    --gold:#B89A5C;--gold-deep:#977C42;--gold-light:#D8C28C;
    --line:#DAD5C7;
    --ease:cubic-bezier(0.16,1,0.3,1);
    --font-sans:"Helvetica Neue","Helvetica","Arial","Noto Sans JP","Yu Gothic","游ゴシック","Hiragino Sans","Meiryo",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:15px;font-weight:300;line-height:1.9;letter-spacing:0.02em;-webkit-font-smoothing:antialiased;}
  img{display:block;max-width:100%;height:auto;}
  a{color:inherit;text-decoration:none;}
  h1,h2,h3{font-weight:500;letter-spacing:0.02em;}

  .topbar{background:var(--navy-deep);color:var(--bg);font-size:10px;letter-spacing:0.32em;text-transform:uppercase;padding:10px;text-align:center;}
  header{padding:22px 48px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  header .back{font-size:11px;letter-spacing:0.24em;text-transform:uppercase;font-weight:500;}
  header .back:hover{color:var(--gold-deep);}
  header .logo img{height:40px;width:auto;}

  /* 一覧 */
  .index-head{max-width:1200px;margin:0 auto;padding:56px 48px 26px;text-align:center;}
  .index-head .eyebrow{font-size:11px;letter-spacing:0.34em;text-transform:uppercase;color:var(--gold-deep);font-weight:500;margin-bottom:14px;}
  .index-head h1{font-size:clamp(28px,2.2vw+14px,44px);line-height:1.15;margin-bottom:14px;}
  .index-head p{font-size:14px;color:var(--ink-2);max-width:640px;margin:0 auto;}
  .brand-grid{max-width:1200px;margin:0 auto;padding:10px 48px 100px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  .brand-cell{background:var(--surface);border:1px solid var(--line);padding:26px 24px;transition:border-color .35s var(--ease),transform .35s var(--ease);}
  .brand-cell:hover{border-color:var(--gold);transform:translateY(-2px);}
  .brand-cell{overflow:hidden;}
  .brand-cell .bc-visual{aspect-ratio:3/4;overflow:hidden;background:var(--bg-2);margin:-26px -24px 18px;}
  .brand-cell .bc-visual img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease);}
  .brand-cell:hover .bc-visual img{transform:scale(1.03);}
  .detail-hero{max-width:820px;margin:0 auto;padding:44px 40px 0;}
  .detail-hero img{width:100%;height:auto;display:block;}
  .brand-cell .bc-flag{margin-bottom:10px;min-height:15px;}
  .b-flag{display:inline-block;vertical-align:middle;margin-right:6px;}
  .detail .eyebrow .b-flag{margin-left:8px;margin-right:0;}
  .brand-cell .bc-name{font-size:17px;font-weight:500;line-height:1.3;margin-bottom:4px;}
  .brand-cell .bc-ja{font-size:11px;letter-spacing:0.16em;color:var(--ink-soft);margin-bottom:12px;}
  .brand-cell .bc-lead{font-size:12.5px;line-height:1.85;color:var(--ink-2);font-weight:300;}
  .brand-cell .bc-more{margin-top:14px;font-size:10.5px;letter-spacing:0.24em;text-transform:uppercase;color:var(--gold-deep);font-weight:500;}

  /* 詳細 */
  .detail{max-width:820px;margin:0 auto;padding:60px 40px 40px;}
  .detail .eyebrow{font-size:10.5px;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold-deep);font-weight:500;margin-bottom:16px;}
  .detail h1{font-size:clamp(28px,2.4vw+14px,46px);line-height:1.12;margin-bottom:10px;}
  .detail .ja{font-size:12px;letter-spacing:0.24em;color:var(--ink-soft);margin-bottom:30px;}
  .detail .rule{width:44px;height:1px;background:var(--gold);margin:0 0 30px;opacity:0.85;}
  .detail .lead{font-size:16px;line-height:2.05;color:var(--ink);font-weight:400;margin-bottom:26px;}
  .detail p.body{font-size:15px;line-height:2.15;color:var(--ink-2);margin-bottom:22px;}
  .detail .to-products{margin-top:34px;padding-top:26px;border-top:1px solid var(--line);}
  .detail .to-products a{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:0.26em;text-transform:uppercase;padding:14px 26px;border:1px solid var(--ink);font-weight:500;transition:all .4s var(--ease);}
  .detail .to-products a:hover{background:var(--navy);color:var(--surface);border-color:var(--navy);}

  .more-brands{max-width:1200px;margin:0 auto;padding:10px 40px 90px;}
  .more-brands h3{font-size:11px;letter-spacing:0.28em;text-transform:uppercase;color:var(--ink);font-weight:600;margin-bottom:20px;}
  .more-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .more-grid a{background:var(--surface);border:1px solid var(--line);padding:16px 18px;font-size:13px;transition:border-color .3s;}
  .more-grid a:hover{border-color:var(--gold);}
  .more-grid .mg-ja{display:block;font-size:10.5px;color:var(--ink-soft);margin-top:4px;}

  .back-cta{text-align:center;padding:10px 20px 80px;}
  .back-cta a{display:inline-flex;align-items:center;gap:12px;font-size:11px;letter-spacing:0.28em;text-transform:uppercase;padding:14px 28px;border:1px solid var(--ink);font-weight:500;transition:all .4s var(--ease);}
  .back-cta a:hover{background:var(--navy);color:var(--surface);border-color:var(--navy);}

  footer{background:var(--navy-deep);color:var(--surface);padding:36px 48px;text-align:center;font-size:10.5px;letter-spacing:0.24em;text-transform:uppercase;opacity:0.65;}

  @media (max-width:900px){
    header,.index-head,.brand-grid,.detail,.more-brands,footer{padding-left:20px;padding-right:20px;}
    .brand-grid{grid-template-columns:1fr;}
    .more-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<script>const SR134_REV = '20260926';</script>

<div class="topbar">Online Store — Coming Soon &nbsp;·&nbsp; 商品は店頭にてご案内しております</div>

<header>
  <a href="index.html" class="back">← Back to Home</a>
  <a href="index.html" class="logo"><img src="sr134_logo.png" alt="Studio Route134"></a>
  <span style="width:120px"></span>
</header>

<!-- 一覧 -->
<section class="index-head" data-index hidden>
  <div class="eyebrow">Brands</div>
  <h1>取り扱いブランド</h1>
  <p>Studio Route134 が取り扱うブランドの成り立ちと、私たちが選ぶ理由をご紹介します。</p>
</section>
<div class="brand-grid" data-index-grid hidden></div>

<!-- 詳細 -->
<div class="detail-hero" data-d-hero hidden><img data-d-hero-img alt=""></div>
<article class="detail" data-detail hidden>
  <div class="eyebrow" data-d-country>Brand</div>
  <h1 data-d-name>—</h1>
  <div class="ja" data-d-ja></div>
  <div class="rule"></div>
  <div class="lead" data-d-lead></div>
  <div data-d-body></div>
  <div class="to-products">
    <a data-d-shop href="shop.html">このブランドの商品を見る <span>→</span></a>
  </div>
</article>

<section class="more-brands" data-more-wrap hidden>
  <h3>Other Brands</h3>
  <div class="more-grid" data-more></div>
</section>

<div class="back-cta">
  <a href="brand.html">ブランド一覧へ <span>→</span></a>
</div>

<footer>© 2026 Studio Route134 / Office T3 Inc.</footer>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// 絵文字の国旗はWindowsで表示されないため、インラインSVGで描画する
const FLAG_SVG = {
  IT: '<svg class="b-flag" viewBox="0 0 24 16" width="22" height="15"><rect width="8" height="16" fill="#009246"/><rect x="8" width="8" height="16" fill="#fff"/><rect x="16" width="8" height="16" fill="#ce2b37"/><rect width="24" height="16" fill="none" stroke="#DAD5C7" stroke-width="0.6"/></svg>',
  FR: '<svg class="b-flag" viewBox="0 0 24 16" width="22" height="15"><rect width="8" height="16" fill="#0055A4"/><rect x="8" width="8" height="16" fill="#fff"/><rect x="16" width="8" height="16" fill="#EF4135"/><rect width="24" height="16" fill="none" stroke="#DAD5C7" stroke-width="0.6"/></svg>',
  US: '<svg class="b-flag" viewBox="0 0 24 16" width="22" height="15"><rect fill="#B22234" width="24" height="16"/><g fill="#fff"><rect y="1.23" width="24" height="1.23"/><rect y="3.69" width="24" height="1.23"/><rect y="6.15" width="24" height="1.23"/><rect y="8.62" width="24" height="1.23"/><rect y="11.08" width="24" height="1.23"/><rect y="13.54" width="24" height="1.23"/></g><rect fill="#3C3B6E" width="10" height="8.62"/><rect width="24" height="16" fill="none" stroke="#DAD5C7" stroke-width="0.6"/></svg>',
  JP: '<svg class="b-flag" viewBox="0 0 24 16" width="22" height="15"><rect fill="#fff" width="24" height="16"/><circle cx="12" cy="8" r="4.8" fill="#BC002D"/><rect width="24" height="16" fill="none" stroke="#DAD5C7" stroke-width="0.6"/></svg>',
  DE: '<svg class="b-flag" viewBox="0 0 24 16" width="22" height="15"><rect width="24" height="5.33" fill="#000"/><rect y="5.33" width="24" height="5.33" fill="#DD0000"/><rect y="10.66" width="24" height="5.34" fill="#FFCE00"/><rect width="24" height="16" fill="none" stroke="#DAD5C7" stroke-width="0.6"/></svg>',
  GB: '<svg class="b-flag" viewBox="0 0 24 16" width="22" height="15"><rect fill="#012169" width="24" height="16"/><path stroke="#fff" stroke-width="2" d="M0,0 L24,16 M24,0 L0,16"/><path stroke="#C8102E" stroke-width="1" d="M0,0 L24,16 M24,0 L0,16"/><path stroke="#fff" stroke-width="4" d="M12,0 v16 M0,8 h24"/><path stroke="#C8102E" stroke-width="2" d="M12,0 v16 M0,8 h24"/><rect width="24" height="16" fill="none" stroke="#DAD5C7" stroke-width="0.6"/></svg>',
};
const flags = codes => (codes || []).map(c => FLAG_SVG[c] || '').join('');

(async () => {
  const all = await (await fetch('brands.json?v=' + SR134_REV)).json();
  const id = new URLSearchParams(location.search).get('id');

  if (!id) {
    $('[data-index]').hidden = false;
    const grid = $('[data-index-grid]');
    grid.hidden = false;
    grid.innerHTML = all.map(b => `
      <a class="brand-cell" href="brand.html?id=${esc(b.id)}">
        ${b.hero ? `<div class="bc-visual"><img src="${esc(b.hero)}" alt="${esc(b.name)}" loading="lazy"></div>` : ''}
        <div class="bc-flag">${flags(b.countries)}</div>
        <div class="bc-name">${esc(b.name)}</div>
        <div class="bc-ja">${esc(b.nameJa || '')}</div>
        <div class="bc-lead">${esc((b.lead || '').slice(0, 96))}…</div>
        <div class="bc-more">Read more →</div>
      </a>`).join('');
    return;
  }

  const b = all.find(x => x.id === id);
  if (!b) { location.replace('brand.html'); return; }

  document.title = `${b.name} — Studio Route134`;
  if (b.hero) {
    $('[data-d-hero]').hidden = false;
    $('[data-d-hero-img]').src = b.hero;
    $('[data-d-hero-img]').alt = b.name;
  }
  $('[data-detail]').hidden = false;
  $('[data-d-country]').innerHTML = `Brand ${flags(b.countries)}`;
  $('[data-d-name]').textContent = b.name;
  $('[data-d-ja]').textContent = b.nameJa || '';
  $('[data-d-lead]').textContent = b.lead || '';
  $('[data-d-body]').innerHTML = (b.body || []).map(p => `<p class="body">${esc(p)}</p>`).join('');
  $('[data-d-shop]').href = 'shop.html?brand=' + encodeURIComponent(b.name);

  const others = all.filter(x => x.id !== b.id).sort(() => Math.random() - 0.5).slice(0, 8);
  $('[data-more-wrap]').hidden = false;
  $('[data-more]').innerHTML = others.map(o => `
    <a href="brand.html?id=${esc(o.id)}">${esc(o.name)}<span class="mg-ja">${esc(o.nameJa || '')}</span></a>`).join('');
})();
</script>
</body>
</html>

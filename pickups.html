<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pick Up — Studio Route134</title>
<meta name="description" content="Studio Route134 のコーディネート特集。週ごとの一着と、その選定理由。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Bodoni+Moda:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5EF; --surface:#FFFFFF; --ink:#15233F; --ink-2:#2C3A52; --ink-soft:#6E7A8E;
    --line:#DAD5C7; --gold:#B89A5C; --gold-deep:#977C42;
    --font-sans:'Noto Sans JP','Helvetica Neue',sans-serif;
    --ease:cubic-bezier(0.16,1,0.3,1);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--surface); color:var(--ink);
    font-family:var(--font-sans); font-weight:300; line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  .wrap{max-width:1240px; margin:0 auto; padding:0 clamp(20px,4vw,56px);}
  header.site{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px clamp(20px,4vw,56px); border-bottom:1px solid var(--line); background:var(--bg);
  }
  .logo{font-family:'Bodoni Moda',serif; font-size:20px; letter-spacing:0.08em; text-decoration:none;}
  .back{font-size:11px; letter-spacing:0.24em; text-transform:uppercase; text-decoration:none; color:var(--ink-soft);}
  .back:hover{color:var(--gold-deep);}
  .head{padding:clamp(40px,5vw,72px) 0 30px;}
  .eyebrow{
    font-size:11px; letter-spacing:0.3em; text-transform:uppercase;
    color:var(--gold-deep); font-weight:500; margin-bottom:14px;
  }
  .head h1{
    font-family:'Bodoni Moda',serif; font-weight:700;
    font-size:clamp(34px,4vw+10px,64px); line-height:1.08; margin:0;
  }
  .list{display:grid; grid-template-columns:repeat(2,1fr); gap:36px; padding-bottom:clamp(56px,6vw,96px);}
  .card{display:flex; flex-direction:column; gap:18px; text-decoration:none; color:inherit;}
  .visual{aspect-ratio:4/3; overflow:hidden; background:var(--bg);}
  .visual img{width:100%; height:100%; object-fit:cover; transition:transform 1.4s var(--ease);}
  .card:hover .visual img{transform:scale(1.04);}
  .date{font-size:10.5px; letter-spacing:0.28em; text-transform:uppercase; color:var(--gold-deep); font-weight:500; margin-bottom:10px;}
  .title{font-size:clamp(19px,1vw+12px,24px); line-height:1.35; font-weight:500; margin-bottom:12px;}
  .lead{font-size:13.5px; line-height:1.9; color:var(--ink-2);}
  footer{border-top:1px solid var(--line); padding:26px 0; font-size:11px; letter-spacing:0.16em; color:var(--ink-soft); text-align:center;}
  @media (max-width:760px){
    .list{grid-template-columns:1fr; gap:28px;}
  }
</style>
</head>
<body>
<script>const SR134_REV = '20260926';</script>

<header class="site">
  <a class="logo" href="index.html">Studio Route134</a>
  <a class="back" href="index.html">← Back to Top</a>
</header>

<div class="wrap">
  <div class="head">
    <div class="eyebrow">Pick Up</div>
    <h1>Pick Up</h1>
  </div>
  <div class="list" data-list></div>
</div>

<footer>© 2026 Studio Route134 / Office T3 Inc.</footer>

<script>
(async function () {
  const list = document.querySelector('[data-list]');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  try {
    const items = await (await fetch('pickup.json?v=' + SR134_REV)).json();
    list.innerHTML = items.map(p => `
      <a class="card" href="pickup.html?id=${encodeURIComponent(p.id)}">
        <div class="visual"><img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy"></div>
        <div>
          <div class="date">${esc(p.date)}</div>
          <div class="title">${esc(p.title)}</div>
          ${p.lead ? `<div class="lead">${esc(p.lead)}</div>` : ''}
        </div>
      </a>`).join('');
  } catch (e) {
    list.innerHTML = '';
  }
})();
</script>
</body>
</html>
